apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: ray-cluster-cpu
  namespace: default
spec:
  rayVersion: '2.52.0'
  headGroupSpec:
    rayStartParams:
      dashboard-host: '0.0.0.0'
    template:
      spec:
        containers:
          - name: ray-head
            image: rayproject/ray:2.52.0
            ports:
              - containerPort: 6379  # Redis
              - containerPort: 8265  # Dashboard
              - containerPort: 10001 # GCS
            resources:
              limits:
                cpu: "1"
                memory: "2Gi"
              requests:
                cpu: "0.5"
                memory: "1Gi"
  workerGroupSpecs:
  - groupName: cpu-workers
    replicas: 1
    rayStartParams: {}
    template:
      spec:
        containers:
        - name: ray-worker
          image: rayproject/ray:2.52.0
          resources:
            limits:
              cpu: "1"
              memory: "2Gi"
            requests:
              cpu: "0.5"
              memory: "1Gi"